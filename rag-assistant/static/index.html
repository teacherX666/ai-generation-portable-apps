<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报错问答助手</title>
  <link rel="stylesheet" href="ui/portal-ui-core.css">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --page-bg: #f3f6fa; --surface: #ffffff; --border: #d9e0ea;
      --text: #172033; --muted: #687386; --accent: #235fd6; --accent-hover: #194fb8;
      --danger-soft: #fee2e2; --danger-text: #b91c1c;
      --radius-md: 6px; --shadow-focus: 0 0 0 3px rgba(35, 95, 214, 0.22);
      --font-size-sm: 12px; --font-size-base: 13px; --font-size-md: 15px;
      --font-weight-medium: 600; --font-weight-bold: 720;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--page-bg); color: var(--text); font-size: var(--font-size-base); display: flex; flex-direction: column; }
    header { flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; font-size: var(--font-size-md); font-weight: var(--font-weight-bold); }
    main { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: var(--radius-md); line-height: 1.65; white-space: pre-wrap; font-size: var(--font-size-base); }
    .msg.q { align-self: flex-end; background: var(--ui-action-primary, var(--accent)); color: #fff; }
    .msg.a { align-self: flex-start; background: var(--ui-bg-surface, var(--surface)); border: 1px solid var(--ui-border-default, var(--border)); color: var(--ui-text-primary, var(--text)); }
    .msg.a.err { background: var(--ui-color-danger-soft, var(--danger-soft)); border-color: #fca5a5; color: var(--ui-color-danger-text, var(--danger-text)); }
    .answer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .answer-label { color: var(--ui-text-secondary, #465267); font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }
    .copy-answer { min-height: 26px; padding: 0 9px; color: #172033; background: #fff; border-color: #cbd5e1; font-size: var(--font-size-sm); }
    .copy-answer:hover:not(:disabled) { color: #172033; background: #eef2f7; border-color: #94a3b8; }
    .copy-answer.is-copied { color: var(--ui-color-success-text, #047857); border-color: #bbf7d0; background: var(--ui-color-success-soft, #dcfce7); }
    .msg img { max-width: 220px; max-height: 160px; border-radius: var(--radius-md); display: block; margin-top: 6px; }
    .msg .note { margin-top: 8px; font-size: var(--font-size-sm); color: var(--muted); }
    .answer-layout { display: grid; gap: 10px; }
    .answer-section { padding-top: 8px; border-top: 1px solid var(--ui-border-default, var(--border)); }
    .answer-section:first-child { padding-top: 0; border-top: 0; }
    .answer-section-title { margin-bottom: 4px; color: var(--ui-text-secondary, #465267); font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }
    .answer-section-body { color: inherit; }
    .msg strong { font-weight: 700; }
    .msg code { background: var(--ui-bg-subtle, #eef2f7); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
    footer { flex-shrink: 0; background: var(--ui-bg-surface, var(--surface)); border-top: 1px solid var(--ui-border-default, var(--border)); padding: 10px 20px; display: flex; flex-direction: column; gap: 8px; }
    .previews { display: flex; gap: 8px; flex-wrap: wrap; }
    .previews:empty { display: none; }
    .thumb { position: relative; width: 56px; height: 56px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .x { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; line-height: 14px; text-align: center; background: rgba(0,0,0,.55); color: #fff; border-radius: 50%; font-size: 12px; cursor: pointer; }
    .row { display: flex; gap: 10px; }
    textarea { flex: 1; resize: none; height: 44px; padding: 11px 12px; border-radius: var(--radius-md); border: 1px solid var(--ui-border-default, var(--border)); background: var(--ui-bg-surface, var(--surface)); color: var(--ui-text-primary, var(--text)); font-size: var(--font-size-base); font-family: inherit; }
    textarea:focus { border-color: var(--accent); box-shadow: var(--shadow-focus); outline: none; }
    button { min-height: 34px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--text-secondary, #465267); font-size: var(--font-size-base); cursor: pointer; }
    button.primary { border: none; background: var(--accent); color: #fff; font-weight: var(--font-weight-medium); }
    button.primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #eef2f7; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    @media (max-width: 640px) {
      main { padding: 12px; }
      footer { padding: 8px 12px; }
      .row { align-items: stretch; }
      .row textarea { min-width: 0; }
      .row .ui-btn { padding-left: 10px; padding-right: 10px; }
      .msg { max-width: 92%; }
    }
  
/* 使用说明悬浮入口（右下角，避开左下角下载进度条与顶部导航） */
.manual-link {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 5000;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: 999px;
  background: #235fd6;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  touch-action: none;
}
.manual-link:hover {
  color: #fff;
  text-decoration: none;
  background: #194fb8;
  transform: none;
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.32);
}
.manual-link.is-dragging { cursor: grabbing; opacity: 0.92; box-shadow: 0 8px 22px rgba(15, 23, 42, 0.35); }
</style>
</head>
<body class="ui-shell ui-page">
  <header class="ui-shell__header">报错问答助手</header>
  <main id="chat" class="ui-main ui-scroll" aria-live="polite">
    <div class="msg a">你好，我是公司内部的报错问答助手。粘贴报错信息、或直接 Ctrl+V 粘贴报错截图，我帮你排查。</div>
  </main>
  <footer class="ui-shell__footer">
    <div class="previews" id="previews"></div>
    <div class="row ui-inline">
      <button id="attach" class="ui-btn ui-btn--secondary" type="button">识图</button>
      <textarea id="q" class="ui-textarea" placeholder="粘贴报错信息或描述问题…"></textarea>
      <button class="primary ui-btn ui-btn--primary" id="send">发送</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </footer>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('q');
    const btn = document.getElementById('send');
    const attachBtn = document.getElementById('attach');
    const fileInput = document.getElementById('file');
    const previews = document.getElementById('previews');
    let images = [];

    function renderPreviews() {
      previews.innerHTML = '';
      images.forEach(function (url, idx) {
        const t = document.createElement('div');
        t.className = 'thumb';
        const img = document.createElement('img');
        img.src = url;
        const x = document.createElement('span');
        x.className = 'x';
        x.textContent = '×';
        x.addEventListener('click', function () { images.splice(idx, 1); renderPreviews(); });
        t.appendChild(img);
        t.appendChild(x);
        previews.appendChild(t);
      });
    }

    function addImage(url) {
      images.push(url);
      renderPreviews();
    }

    attachBtn.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = function () { addImage(r.result); fileInput.value = ''; };
      r.readAsDataURL(f);
    });
    document.addEventListener('paste', function (e) {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const it of items) {
        if (it.type && it.type.indexOf('image') === 0) {
          const blob = it.getAsFile();
          const r = new FileReader();
          r.onload = function () { addImage(r.result); };
          r.readAsDataURL(blob);
        }
      }
    });

    function addMsg(html, cls, rawText) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerHTML = html;
      if (cls === 'a' && rawText) {
        const head = document.createElement('div');
        head.className = 'answer-head';
        const label = document.createElement('span');
        label.className = 'answer-label';
        label.textContent = '回答';
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'copy-answer ui-btn ui-btn--secondary';
        copy.textContent = '复制';
        copy.addEventListener('click', async function () {
          try {
            await navigator.clipboard.writeText(rawText);
            copy.textContent = '已复制';
            copy.classList.add('is-copied');
            setTimeout(function () { copy.textContent = '复制'; copy.classList.remove('is-copied'); }, 1400);
          } catch (e) {
            copy.textContent = '复制失败';
            setTimeout(function () { copy.textContent = '复制'; }, 1400);
          }
        });
        head.append(label, copy);
        div.prepend(head);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function mdToHtml(md) {
      let s = esc(md);
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      return s;
    }

    function structuredAnswer(md) {
      const raw = String(md || '').trim();
      const labels = [
        ['结论', '结论'], ['原因', '原因'], ['建议操作', '建议操作'], ['引用', '引用'],
        ['参考', '引用'], ['是否解决反馈', '是否解决反馈']
      ];
      const found = [];
      labels.forEach(function (pair) {
        const re = new RegExp('(?:^|\\n)\\s*(?:#+\\s*)?' + pair[0] + '\\s*[:：]?\\s*([\\s\\S]*?)(?=\\n\\s*(?:#+\\s*)?(?:结论|原因|建议操作|引用|参考|是否解决反馈)\\s*[:：]?|$)', 'i');
        const m = raw.match(re);
        if (m && m[1] && !found.some(function (x) { return x[0] === pair[1]; })) found.push([pair[1], m[1].trim()]);
      });
      if (!found.length) return mdToHtml(raw);
      return '<div class="answer-layout">' + found.map(function (item) {
        return '<section class="answer-section"><div class="answer-section-title">' + esc(item[0]) + '</div><div class="answer-section-body">' + mdToHtml(item[1]) + '</div></section>';
      }).join('') + '</div>';
    }

    async function send() {
      const question = input.value.trim();
      if ((!question && !images.length) || btn.disabled) return;
      btn.disabled = true;
      let qHtml = '';
      images.forEach(function (url) { qHtml += '<img src="' + url + '">'; });
      if (question) qHtml += (qHtml ? '<br>' : '') + esc(question);
      addMsg(qHtml, 'q');
      const imgs = images.slice();
      images = [];
      renderPreviews();
      input.value = '';
      const a = addMsg('分析中…', 'a');
      try {
        const res = await fetch('api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, images: imgs })
        });
        const data = await res.json();
        if (res.ok && data.answer) {
          a.innerHTML = structuredAnswer(data.answer);
          const head = document.createElement('div');
          head.className = 'answer-head';
          const label = document.createElement('span');
          label.className = 'answer-label';
          label.textContent = '回答';
          const copy = document.createElement('button');
          copy.type = 'button';
          copy.className = 'copy-answer ui-btn ui-btn--secondary';
          copy.textContent = '复制';
          copy.addEventListener('click', async function () {
            try {
              await navigator.clipboard.writeText(String(data.answer));
              copy.textContent = '已复制';
              copy.classList.add('is-copied');
              setTimeout(function () { copy.textContent = '复制'; copy.classList.remove('is-copied'); }, 1400);
            } catch (e) {
              copy.textContent = '复制失败';
              setTimeout(function () { copy.textContent = '复制'; }, 1400);
            }
          });
          head.append(label, copy);
          a.prepend(head);
          a.classList.remove('err');
          if (data.candidate_written) {
            const note = document.createElement('div');
            note.className = 'note';
            note.textContent = '（已自动提交一条候选修复，等待后台审核）';
            a.appendChild(note);
          }
        } else {
          a.textContent = data.error || '出错了，请稍后重试。';
          a.classList.add('err');
        }
      } catch (e) {
        a.textContent = '网络异常：' + e.message;
        a.classList.add('err');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    btn.addEventListener('click', send);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
  <!-- 使用说明入口：新标签页打开飞书文档（Portal iframe 与独立模式都可见） -->
  <a id="manualLink" class="manual-link" draggable="false" target="_blank" rel="noopener"
     title="可拖动到任意位置 · 点击打开使用说明（飞书文档）"
     href="https://redcqchina.feishu.cn/docx/LPf8dKvx7ocfnRxbgCXcL5dfnOb">📖 使用说明</a>


  <script>
  /* 使用说明按钮：可拖动 + 记住位置（按应用分 key，避免同源页面互相覆盖） */
  (function () {
    function initDrag(id, key) {
      var el = document.getElementById(id);
      if (!el) return;
      /* 禁止 <a> 原生拖拽（会吃掉 pointer 事件，导致按钮拖不动只拖出链接） */
      el.setAttribute('draggable', 'false');
      el.addEventListener('dragstart', function (e) { e.preventDefault(); });
      var MOVE = 4, startX = 0, startY = 0, oL = 0, oT = 0, moved = false, dragging = false;
      function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
      function save() {
        var r = el.getBoundingClientRect();
        try { localStorage.setItem(key, JSON.stringify({ left: r.left, top: r.top, w: r.width, h: r.height })); } catch (e) {}
      }
      function restore() {
        try {
          var p = JSON.parse(localStorage.getItem(key) || 'null');
          if (!p || typeof p.left !== 'number') return;
          var w = el.offsetWidth || p.w || 120, h = el.offsetHeight || p.h || 40;
          el.style.right = 'auto'; el.style.bottom = 'auto';
          el.style.left = clamp(p.left, 0, window.innerWidth - w - 8) + 'px';
          el.style.top = clamp(p.top, 0, window.innerHeight - h - 8) + 'px';
        } catch (e) {}
      }
      el.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        dragging = true; moved = false;
        startX = e.clientX; startY = e.clientY;
        var r = el.getBoundingClientRect();
        el.style.right = 'auto'; el.style.bottom = 'auto';
        el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
        oL = r.left; oT = r.top;
        el.classList.add('is-dragging');
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
      });
      el.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        if (Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY) > MOVE) moved = true;
        if (moved) {
          el.style.left = clamp(oL + e.clientX - startX, 0, window.innerWidth - el.offsetWidth - 8) + 'px';
          el.style.top = clamp(oT + e.clientY - startY, 0, window.innerHeight - el.offsetHeight - 8) + 'px';
        }
      });
      function end() {
        if (!dragging) return;
        dragging = false;
        el.classList.remove('is-dragging');
        save();
        if (moved) {
          /* 拖动后抑制本次点击，避免误开文档 */
          var cancel = function (ev) { ev.preventDefault(); ev.stopPropagation(); el.removeEventListener('click', cancel, true); };
          el.addEventListener('click', cancel, true);
          setTimeout(function () { el.removeEventListener('click', cancel, true); }, 400);
        }
      }
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      restore();
    }
    initDrag('manualLink', 'manualLinkPos_rag');
  })();
  </script>
</body>
</html>
