<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volcengine Portrait</title>
  <link rel="stylesheet" href="/ui/portal-ui-core.css">
  <style>
    body { margin: 0; }
    .status-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .status-card { width: min(100%, 560px); padding: 32px; text-align: center; }
    .status-card h1 { margin: 0 0 10px; color: var(--ui-text-primary); font-size: var(--ui-font-size-lg); }
    .status-card p { margin: 6px 0; color: var(--ui-text-secondary); font-size: var(--ui-font-size-base); }
    .status-card .ui-caption { margin-top: 14px; }
  </style>
</head>
<body class="ui-page ui-shell">
  <main class="status-page ui-shell__body">
    <section class="status-card ui-panel" aria-labelledby="portrait-title">
      <h1 id="portrait-title">Volcengine Portrait</h1>
      <p>人像生成子应用正在运行中</p>
      <p class="ui-caption">请通过 Portal 主页面访问此功能</p>
    </section>
  </main>
</body>
</html>
