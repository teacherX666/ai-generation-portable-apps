<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Generation Portal — 登录</title>
<link rel="stylesheet" href="/ui/portal-ui-core.css">
<style>
/* 登录发生在认证之前，因此这里必须保留一套可独立工作的最小样式。
   即使共享 UI Core 因网络或认证配置暂时不可用，页面也不能退化成裸 HTML。 */
:root{
  --ui-bg-canvas:#f3f6fa;
  --ui-bg-surface:#fff;
  --ui-bg-sunken:#eef2f7;
  --ui-text-primary:#172033;
  --ui-text-secondary:#475569;
  --ui-text-muted:#748196;
  --ui-border-default:#d7dee8;
  --ui-action-primary:#235fd6;
  --ui-action-primary-hover:#184fbf;
  --ui-color-danger-text:#b42318;
  --ui-font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ui-font-size-base:13px;
  --ui-font-size-md:15px;
  --ui-font-size-lg:20px;
  --ui-font-weight-medium:600;
  --ui-font-weight-bold:700;
  --ui-radius-md:8px;
  --ui-focus-ring:0 0 0 3px rgba(35,95,214,.16);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--ui-bg-canvas);color:var(--ui-text-primary);font-family:var(--ui-font-family);font-size:var(--ui-font-size-base);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.login-card{width:100%;max-width:400px;padding:32px;background:var(--ui-bg-surface);border:1px solid var(--ui-border-default);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
h1{font-size:var(--ui-font-size-lg);font-weight:var(--ui-font-weight-bold);margin:0 0 6px;color:var(--ui-text-primary)}
.sub{font-size:var(--ui-font-size-base);color:var(--ui-text-muted);margin:0 0 24px}
label{display:block;font-size:var(--ui-font-size-base);color:var(--ui-text-secondary);margin-bottom:16px}
label span{display:block;margin-bottom:4px}
input[type=text],input[type=password]{width:100%;min-height:36px;padding:0 12px;background:var(--ui-bg-surface);border:1px solid var(--ui-border-default);border-radius:var(--ui-radius-md);color:var(--ui-text-primary);font-size:var(--ui-font-size-md);outline:none}
input:focus{border-color:var(--ui-action-primary);box-shadow:var(--ui-focus-ring)}
button{width:100%;min-height:38px;padding:0 14px;background:var(--ui-action-primary);color:#fff;border:1px solid var(--ui-action-primary);border-radius:var(--ui-radius-md);font-size:var(--ui-font-size-base);font-weight:var(--ui-font-weight-medium);cursor:pointer;margin-top:8px}
button:hover{background:var(--ui-action-primary-hover);border-color:var(--ui-action-primary-hover)}
button:disabled{background:var(--ui-bg-sunken);border-color:var(--ui-border-default);color:var(--ui-text-muted);cursor:default}
.err{color:var(--ui-color-danger-text);font-size:var(--ui-font-size-base);margin-top:12px;text-align:center;min-height:20px}
.toggle{margin-top:14px;text-align:center;font-size:var(--ui-font-size-base);color:var(--ui-text-muted)}
.toggle a{color:var(--ui-action-primary);cursor:pointer;text-decoration:underline}
.toggle a:hover{color:var(--ui-action-primary-hover)}
</style>
</head>
<body class="ui-page">
<div class="login-card ui-panel">
  <h1 id="title">登录</h1>
  <p class="sub" id="subtitle">AI Generation Portal</p>
  <form id="form">
    <label><span>用户名</span><input id="username" type="text" autocomplete="username" required></label>
    <label><span>密码</span><input id="password" type="password" autocomplete="current-password" required></label>
    <label id="confirmWrap" style="display:none"><span>确认密码</span><input id="confirm" type="password" autocomplete="new-password"></label>
    <button id="btn" type="submit">登录</button>
    <div class="err" id="err"></div>
  </form>
  <div class="toggle" id="toggleWrap" style="display:none">
    <span id="toggleText">还没有账号？</span><a id="toggleLink">立即注册</a>
  </div>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const next = q.get('next') || '/';
  let mode = 'login'; // 'login' | 'register' | 'setup'
  let signupEnabled = false;
  let isFirstRun = false;

  // Already logged in?
  try {
    const r = await fetch('/api/auth/me', {credentials: 'include'});
    if (r.ok) { location.replace(next); return; }
  } catch(_) {}

  try {
    const r = await fetch('/api/auth/first-run');
    const d = await r.json();
    isFirstRun = !!d?.first_run;
    signupEnabled = !!d?.signup_enabled;
  } catch(_) {}

  if (isFirstRun) {
    mode = 'setup';
  }

  function render() {
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const confirmWrap = document.getElementById('confirmWrap');
    const btn = document.getElementById('btn');
    const toggleWrap = document.getElementById('toggleWrap');
    const toggleText = document.getElementById('toggleText');
    const toggleLink = document.getElementById('toggleLink');
    const pwInput = document.getElementById('password');

    if (mode === 'setup') {
      title.textContent = '初始化管理员账号';
      subtitle.textContent = '首次使用，请设置管理员用户名和密码';
      confirmWrap.style.display = 'block';
      btn.textContent = '创建管理员账号';
      pwInput.autocomplete = 'new-password';
      toggleWrap.style.display = 'none';
    } else if (mode === 'register') {
      title.textContent = '注册账号';
      subtitle.textContent = '创建你的 AI Generation Portal 账号';
      confirmWrap.style.display = 'block';
      btn.textContent = '注册并登录';
      pwInput.autocomplete = 'new-password';
      toggleWrap.style.display = 'block';
      toggleText.textContent = '已有账号？';
      toggleLink.textContent = '返回登录';
    } else {
      title.textContent = '登录';
      subtitle.textContent = 'AI Generation Portal';
      confirmWrap.style.display = 'none';
      btn.textContent = '登录';
      pwInput.autocomplete = 'current-password';
      toggleWrap.style.display = signupEnabled ? 'block' : 'none';
      toggleText.textContent = '还没有账号？';
      toggleLink.textContent = '立即注册';
    }
  }

  document.getElementById('toggleLink').addEventListener('click', () => {
    mode = (mode === 'register') ? 'login' : 'register';
    document.getElementById('err').textContent = '';
    render();
  });

  render();

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    err.textContent = '';
    if (mode === 'setup' || mode === 'register') {
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) { err.textContent = '两次密码不一致'; return; }
      if (password.length < 6) { err.textContent = '密码至少 6 位'; return; }
    }
    const origLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = '请稍候...';
    try {
      const url = (mode === 'login') ? '/api/auth/login' : '/api/auth/register';
      const r = await fetch(url, {
        method: 'POST', credentials: 'include',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password}),
      });
      const d = await r.json();
      if (d.ok) { location.replace(next); }
      else {
        err.textContent = d.error || '操作失败';
        btn.disabled = false;
        btn.textContent = origLabel;
      }
    } catch(_) {
      err.textContent = '网络错误';
      btn.disabled = false;
      btn.textContent = origLabel;
    }
  });
})();
</script>
</body>
</html>
